<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Telegram…</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --mtn-yellow:      #FFCB05;
            --mtn-yellow-dark: #E6B800;
            --mtn-navy:        #003366;
            --telegram-blue:   #229ED9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(160deg, var(--mtn-navy) 0%, #004080 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: #fff;
            border-radius: 20px;
            padding: 48px 36px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: cardIn 0.5s cubic-bezier(.22,.9,.36,1.2);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .icon-wrap {
            width: 96px;
            height: 96px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, var(--telegram-blue), #1B84B8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(34,158,217,0.35);
            position: relative;
        }

        .icon-wrap::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid rgba(34,158,217,0.35);
            animation: pulse 2s ease-out infinite;
        }

        @keyframes pulse {
            0%   { transform: scale(1);   opacity: 0.8; }
            100% { transform: scale(1.25); opacity: 0; }
        }

        .telegram-svg {
            width: 48px;
            height: 48px;
            fill: #fff;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--mtn-navy);
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #5a6474;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .countdown {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
        }

        .countdown svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .countdown-track {
            fill: none;
            stroke: #eef2f7;
            stroke-width: 6;
        }

        .countdown-progress {
            fill: none;
            stroke: var(--mtn-yellow);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 283;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        .countdown-number {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            color: var(--mtn-navy);
        }

        .countdown-label {
            font-size: 0.82rem;
            color: #94a0b0;
            margin-bottom: 28px;
            font-weight: 500;
        }

        .btn-telegram {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 20px;
            background: var(--telegram-blue);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 6px 16px rgba(34,158,217,0.35);
        }

        .btn-telegram:hover {
            background: #1B84B8;
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(34,158,217,0.45);
        }

        .btn-telegram:active {
            transform: translateY(0);
        }

        .btn-telegram svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.78rem;
            color: #94a0b0;
        }

        .config-warning {
            display: none;
            background: #FEF2F2;
            border: 1.5px solid #FECACA;
            color: #991B1B;
            border-radius: 10px;
            padding: 12px 16px;
            margin-top: 16px;
            font-size: 0.82rem;
            text-align: left;
        }
        .config-warning.show { display: block; }

        @media (max-width: 480px) {
            .card { padding: 40px 24px 32px; }
            .title { font-size: 1.3rem; }
            .icon-wrap { width: 80px; height: 80px; }
            .telegram-svg { width: 40px; height: 40px; }
            .countdown { width: 88px; height: 88px; }
            .countdown-number { font-size: 1.7rem; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-wrap">
            <svg class="telegram-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
            </svg>
        </div>

        <h1 class="title">You're being redirected</h1>
        <p class="subtitle">You'll be taken to our Telegram channel in a moment</p>

        <div class="countdown">
            <svg viewBox="0 0 100 100">
                <circle class="countdown-track" cx="50" cy="50" r="45"></circle>
                <circle class="countdown-progress" id="countdownCircle" cx="50" cy="50" r="45"></circle>
            </svg>
            <div class="countdown-number" id="countdownNum">5</div>
        </div>
        <p class="countdown-label">Redirecting automatically…</p>

        <a href="#" id="telegramBtn" class="btn-telegram">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
            </svg>
            Open Telegram Now
        </a>

        <p class="footer-note">If nothing happens, click the button above.</p>

        <div class="config-warning" id="configWarning">
            ⚠️ <strong>Telegram URL not configured.</strong> Please set the
            <code>TELEGRAM_URL</code> environment variable on the server.
        </div>
    </div>

    <script>
        // ─────────────────────────────────────────────────────
        // TELEGRAM_URL is injected by the server from .env
        // ─────────────────────────────────────────────────────
        const TELEGRAM_URL = "%%TELEGRAM_URL%%";

        const TOTAL_SECONDS = 5;
        let secondsLeft = TOTAL_SECONDS;
        let redirected = false;

        const countdownNum = document.getElementById('countdownNum');
        const countdownCircle = document.getElementById('countdownCircle');
        const telegramBtn = document.getElementById('telegramBtn');
        const configWarning = document.getElementById('configWarning');

        // ── Check if the URL was actually injected ──
        const isConfigured =
            TELEGRAM_URL &&
            TELEGRAM_URL !== '%%TELEGRAM_URL%%' &&
            TELEGRAM_URL.trim() !== '';

        if (!isConfigured) {
            // Show the warning and stop the countdown
            configWarning.classList.add('show');
            telegramBtn.style.opacity = '0.5';
            telegramBtn.style.pointerEvents = 'none';
            countdownNum.textContent = '—';
            document.querySelector('.countdown-label').textContent = 'Waiting for configuration…';
        } else {
            // Wire the button
            telegramBtn.href = TELEGRAM_URL;
            telegramBtn.addEventListener('click', (e) => {
                e.preventDefault();
                redirectNow();
            });

            // Start countdown
            startCountdown();
        }

        function redirectNow() {
            if (redirected || !isConfigured) return;
            redirected = true;
            window.location.href = TELEGRAM_URL;
        }

        function updateCircle() {
            const progress = (TOTAL_SECONDS - secondsLeft) / TOTAL_SECONDS;
            countdownCircle.style.strokeDashoffset = (283 * progress).toString();
        }

        function startCountdown() {
            updateCircle();
            const tick = setInterval(() => {
                secondsLeft--;
                countdownNum.textContent = secondsLeft;
                updateCircle();

                if (secondsLeft <= 0) {
                    clearInterval(tick);
                    redirectNow();
                }
            }, 1000);
        }
    </script>
</body>
</html>
